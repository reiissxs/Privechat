<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Telegram</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #222222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Overlay e blur do fundo */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Popup de idade */
    .modal {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: pop 0.25s ease;
    }

    @keyframes pop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #222;
    }

    .modal p {
      font-size: 15px;
      color: #707579;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-yes {
      background: #0088cc;
      color: white;
    }

    .btn-yes:hover {
      background: #006699;
    }

    .btn-no {
      background: #f0f0f0;
      color: #222;
    }

    .btn-no:hover {
      background: #e0e0e0;
    }

    .denied {
      color: #d32f2f;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }

    /* Conteúdo principal */
    #content {
      text-align: center;
      padding: 20px;
      filter: blur(8px);
      pointer-events: none;
      transition: filter 0.4s ease;
    }

    #content.unlocked {
      filter: none;
      pointer-events: auto;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
    }

    .logo svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      color: #707579;
      margin-bottom: 32px;
      font-size: 16px;
    }

    .cta-button {
      display: inline-block;
      background: #0088cc;
      color: white;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.35);
      transition: all 0.2s ease;
    }

    .cta-button:hover {
      background: #006699;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 136, 204, 0.45);
    }

    .cta-button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Overlay + Popup de idade -->
  <div id="overlay">
    <div class="modal">
      <h2>Você tem mais de 18 anos?</h2>
      <p>Este conteúdo é destinado apenas para maiores de idade.</p>
      <div class="modal-buttons">
        <button class="btn btn-yes" onclick="confirmAge(true)">Sim, tenho mais de 18</button>
        <button class="btn btn-no" onclick="confirmAge(false)">Não</button>
      </div>
      <p class="denied" id="deniedMsg">Acesso restrito para maiores de 18 anos.</p>
    </div>
  </div>

  <!-- Conteúdo principal -->
  <div id="content">
    <div class="logo">
      <!-- Logo Telegram (SVG oficial) -->
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <circle cx="120" cy="120" r="120" fill="#0088cc"/>
        <path fill="#fff" d="M54.3 118.8l110.3-42.6c5.1-2 9.6 1.2 7.9 8.5l-18.7 88.1c-1.3 5.8-4.8 7.2-9.7 4.5l-26.8-19.8-12.9 12.4c-1.4 1.4-2.6 2.6-5.3 2.6l1.9-27.1 49.3-44.5c2.1-1.9-.5-2.9-3.3-1.1l-60.9 38.4-26.2-8.2c-5.7-1.8-5.8-5.7 1.2-8.4z"/>
      </svg>
    </div>

    <h1>Entre no Grupo</h1>
    <p class="subtitle">Clique no botão abaixo para acessar</p>

    <a href="https://t.me/metteflixx_bot" target="_blank" rel="noopener noreferrer" class="cta-button">
      Clique aqui
    </a>
  </div>

  <script>
    function confirmAge(isAdult) {
      const overlay = document.getElementById('overlay');
      const content = document.getElementById('content');
      const denied = document.getElementById('deniedMsg');

      if (isAdult) {
        overlay.classList.add('hidden');
        content.classList.add('unlocked');
        // Remove o overlay da tela após a animação
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 300);
      } else {
        denied.style.display = 'block';
        // Opcional: desabilitar botões após negar
        document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
      }
    }

    // Impede scroll enquanto o popup estiver ativo
    document.body.style.overflow = 'hidden';
  </script>
</body>
</html>
