<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17090f"><title>PRIVE CHAT — Conexões sem complicação</title><style>
:root{--bg:#10080d;--panel:#211018;--panel2:#2c1721;--wine:#6f243d;--wine2:#9e3659;--gold:#e7bf70;--cream:#fff4e5;--muted:#bcaab1;--line:#57303f;--pink:#dc7894;--green:#45d7a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:100px;background:radial-gradient(ellipse at 50% -10%,#542034 0,transparent 45%),var(--bg)}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#160a11ed;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0b}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:22px;letter-spacing:-.6px}.logo{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),#c78b35);color:#28131b;font-weight:1000;font-size:22px;box-shadow:0 4px 20px #e7bf7020}.top-actions{display:flex;align-items:center;gap:10px}.coin{background:#352218;border:1px solid #a67a3a88;color:var(--gold);border-radius:24px;padding:9px 12px;font-weight:800}.iconbtn{width:40px;height:40px;border-radius:50%;background:#ffffff0b;border:1px solid #ffffff10;font-size:20px}.banner{margin:12px 14px 16px;padding:12px 14px;border-radius:14px;background:linear-gradient(105deg,#7e2948,#d17b79);font-size:13px;font-weight:750;display:flex;justify-content:space-between;align-items:center}.banner button{background:#ffffff22;border:1px solid #ffffff55;border-radius:10px;padding:7px 10px}.page{padding:0 14px}.pagehead{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 14px}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:850;color:var(--gold)}h1{font-size:29px;line-height:1.08;letter-spacing:-.9px;margin:7px 0}h2{font-size:21px;margin:0;letter-spacing:-.4px}.muted{color:var(--muted)}.sub{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}.btn{border-radius:15px;padding:14px 18px;font-weight:850;background:linear-gradient(110deg,#e8c87d,#c99949);color:#28141a;box-shadow:0 7px 24px #d4a04b20}.btn.ghost{background:#ffffff0b;border:1px solid var(--line);color:var(--cream);box-shadow:none}.btn.wine{background:linear-gradient(110deg,#a64665,#6f243d);color:white}.hero{padding:22px 20px;border:1px solid #b9824938;border-radius:24px;background:linear-gradient(140deg,#3a1928,#1b0d14 70%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-50px;top:-70px;background:#e7bf7010;border:1px solid #e7bf7020}.hero h1{font-size:32px;max-width:380px}.hero p{max-width:430px;font-size:14px;color:#d0bbc3;line-height:1.55}.hero .btn{width:100%;margin-top:12px}.proof{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);margin-top:15px}.live{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 12px #45d7a1}.avatars{display:flex;margin-left:3px}.avatars span{width:25px;height:25px;border:2px solid var(--bg);border-radius:50%;margin-left:-5px;background:linear-gradient(145deg,#e6bd9b,#9d5169);display:grid;place-items:center;font-size:10px;color:#27121a;font-weight:900}.section{margin-top:26px}.sectionline{display:flex;align-items:center;justify-content:space-between;margin:0 2px 13px}.textbtn{background:none;color:var(--gold);font-size:12px;font-weight:800}.filters{display:flex;gap:8px;overflow:auto;padding:1px 0 13px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#ffffff07;border-radius:22px;padding:9px 14px;color:#d8c7cd;font-size:12px}.filter.active{background:#7c2c47;border-color:#b15b78;color:white}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.profile{height:252px;border-radius:19px;overflow:hidden;position:relative;background:#442331;border:1px solid #ffffff15;isolation:isolate}.profile img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.83)}.profile:after{content:"";position:absolute;inset:25% 0 0;background:linear-gradient(transparent,#0b060de8);z-index:0}.profile .status{position:absolute;top:10px;left:10px;z-index:1;border-radius:20px;padding:7px 9px;background:#24121ddd;border:1px solid #ffffff24;font-size:10px;font-weight:800}.status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}.profile .heart{position:absolute;right:10px;top:10px;width:31px;height:31px;border-radius:50%;background:#1a0c16a8;border:1px solid #ffffff2a}.profile .pinfo{position:absolute;z-index:1;left:12px;right:10px;bottom:12px}.pname{font-size:16px;font-weight:850}.ploc{font-size:11px;color:#eadbe0;margin-top:5px}.mini{margin-top:9px;background:#ffffff16;border:1px solid #ffffff29;border-radius:11px;padding:8px 10px;font-size:11px;font-weight:800;width:100%;backdrop-filter:blur(8px)}.matchpanel{margin-top:16px;border:1px solid #7a4653;border-radius:22px;padding:17px;background:linear-gradient(135deg,#321725,#1c0d15)}.matchpaneltop{display:flex;align-items:center;justify-content:space-between}.matchpanel .big{font-size:27px;font-weight:900;color:var(--gold)}.matchpanel .btn{width:100%;margin-top:15px}.bottomnav{position:fixed;z-index:10;bottom: max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);padding:9px;background:#251321eF;border:1px solid #805166;border-radius:25px;box-shadow:0 10px 35px #0008;backdrop-filter:blur(20px)}.navitem{position:relative;background:transparent;color:#aa929d;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 3px;border-radius:16px;font-size:10px;font-weight:750}.navitem .ni{font-size:23px;line-height:1}.navitem.active{color:var(--gold);background:#74405a44}.badge{position:absolute;top:0;right:20%;background:#d75b7e;color:white;border-radius:20px;font-size:9px;padding:3px 5px}.list{display:flex;flex-direction:column;gap:9px}.chatrow{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #ffffff0c;background:#ffffff05;border-radius:17px;text-align:left;width:100%}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--wine2);flex-shrink:0}.chatmeta{min-width:0;flex:1}.chatmeta b{display:block;font-size:14px}.chatmeta p{font-size:12px;color:var(--muted);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);align-self:flex-start}.callhero{border-radius:23px;padding:24px 18px;text-align:center;background:radial-gradient(circle at 50% 30%,#74364f,#27111f 65%);border:1px solid #704053}.orb{width:165px;height:165px;border-radius:50%;margin:20px auto;display:grid;place-items:center;border:1px solid #c38b9d55;box-shadow:0 0 0 13px #b86d8a0c,0 0 0 28px #b86d8a08;background:#190b14}.orb .logo{width:90px;height:90px;border-radius:30px;font-size:44px}.callhero .btn{width:100%;max-width:360px;margin-top:14px}.metric{display:flex;justify-content:space-around;margin:20px 0 4px}.metric b{display:block;font-size:22px}.metric span{font-size:11px;color:var(--muted)}.profilehead{text-align:center;padding:24px 15px 20px;border-radius:22px;background:linear-gradient(155deg,#54243a,#1a0c15)}.bigavatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);padding:3px}.profilehead h2{margin-top:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px}.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:var(--muted)}.tile{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid #ffffff12;background:#ffffff06;border-radius:16px;margin-top:9px;text-align:left;width:100%}.tileicon{width:42px;height:42px;border-radius:13px;background:#71334b;display:grid;place-items:center;font-size:20px}.tile .desc{flex:1}.tile b{display:block}.tile small{display:block;color:var(--muted);margin-top:4px}.tile .arrow{color:#c5aeb8;font-size:22px}.modalback{position:fixed;z-index:20;inset:0;background:#090509cc;display:flex;align-items:flex-end;justify-content:center;padding:14px;backdrop-filter:blur(7px)}.modal{width:min(520px,100%);border:1px solid #9d6275;border-radius:24px 24px 20px 20px;padding:23px;background:linear-gradient(150deg,#432032,#1b0c15);box-shadow:0 20px 70px #0009}.modal h2{font-size:23px}.modal p{font-size:13px;line-height:1.5;color:#d0bcc4}.modal .btn{width:100%;margin-top:9px}.modal .btn.ghost{margin-top:8px}.incoming{display:flex;align-items:center;gap:12px;margin:18px 0}.incoming img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}.incoming .caller{flex:1}.incoming b{display:block}.incoming small{color:var(--muted);display:block;margin-top:5px}.callactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.callactions button{border-radius:16px;padding:14px;font-weight:850}.accept{background:#39c98e;color:#10241b}.decline{background:#e85b70;color:#fff}.toast{position:fixed;z-index:30;left:50%;bottom:110px;transform:translateX(-50%);padding:12px 17px;background:#f4e7d6;color:#24121a;border-radius:14px;font-size:13px;font-weight:800;box-shadow:0 8px 30px #0008;max-width:calc(100% - 30px);text-align:center}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:17px;font-size:13px}.field{width:100%;padding:13px 14px;border-radius:13px;background:#10080d;border:1px solid var(--line);color:var(--cream);margin:8px 0}.chatbubble{padding:12px 14px;border-radius:16px;background:#38202d;margin:9px 0;max-width:85%;font-size:13px}.chatbubble.mine{margin-left:auto;background:#81405a}.footerhint{text-align:center;color:#8d7681;font-size:10px;padding:25px 8px}

</style></head><body><div class="app"><header class="top"><div class="brand"><span class="logo">P.</span><span>PRIVE <span style="color:var(--gold)">CHAT</span></span></div><div class="top-actions"><button class="coin" onclick="openShop()">◉ <span id="coins">0</span> <b>＋</b></button><button class="iconbtn" onclick="showToast('Seus bônus estarão disponíveis após a integração da conta.')" aria-label="Bônus">🎁</button><button class="iconbtn" onclick="simulateIncoming()" aria-label="Notificações">♧</button></div></header><div class="banner">✦ Uma nova conexão pode começar hoje <button onclick="showToast('PRIVE CHAT · experiência para maiores de 18 anos')">18+</button></div><main class="page" id="content"></main><nav class="bottomnav"><button class="navitem active" data-tab="home"><span class="ni">⌂</span>Início</button><button class="navitem" data-tab="calls"><span class="ni">▣</span>Chamadas</button><button class="navitem" data-tab="messages"><span class="ni">▤</span>Mensagens <span class="badge">2</span></button><button class="navitem" data-tab="profile"><span class="ni">♙</span>Perfil</button></nav></div><div id="overlay"></div><script>
const people=[{name:'Marina',age:22,loc:'São Paulo, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=85',msg:'Oi! Tudo bem?'},{name:'Lívia',age:24,loc:'Campinas, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=85',msg:'Vamos conversar? 💬'},{name:'Helena',age:21,loc:'Santos, Brasil',status:'Ocupado',img:'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=700&q=85',msg:'Acabei de chegar por aqui'},{name:'Clara',age:23,loc:'Rio de Janeiro, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=700&q=85',msg:'Adorei te conhecer 😊'},{name:'Isabela',age:25,loc:'Curitiba, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=700&q=85',msg:'Oi, tudo bem?'},{name:'Júlia',age:20,loc:'Belo Horizonte, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=700&q=85',msg:'Bora conversar ✨'}];let tab='home',filter='Todos',coins=0,liked=new Set(),searching=false,chatPerson=null,chatMessages=[];const content=document.getElementById('content');function img(p,cls='avatar'){return `<img class="${cls}" src="${p.img}" alt="Foto de perfil de ${p.name}" loading="lazy">`}function card(p,i){return `<article class="profile">${img(p,'')}<span class="status">${p.status}</span><button class="heart" onclick="toggleLike(${i})">${liked.has(i)?'♥':'♡'}</button><div class="pinfo"><div class="pname">${p.name}, ${p.age}</div><div class="ploc">⌖ ${p.loc}</div><button class="mini" onclick="openChat(${i})">Enviar mensagem ↗</button></div></article>`}function renderHome(){return `<section class="hero"><div class="eyebrow"><span class="live"></span> CONEXÕES PARA ACONTECER</div><h1>Conheça alguém novo.<br><span style="color:var(--gold)">No seu ritmo.</span></h1><p>Encontre perfis, comece uma conversa ou entre na busca por uma videochamada. Uma experiência feita para você.</p><button class="btn" onclick="startSearch()">▣ &nbsp; Encontrar videochamada &nbsp; ↗</button><div class="proof"><div class="avatars"><span>M</span><span>L</span><span>H</span><span>+</span></div><span><span class="live"></span> Pessoas descobrindo novas conexões</span></div></section><section class="section"><div class="sectionline"><h2>Pessoas para conhecer</h2><button class="textbtn" onclick="setTab('calls')">Ver chamadas →</button></div><div class="filters">${['Todos','Online','Perto de mim','Favoritos'].map(f=>`<button class="filter ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div><div class="cards">${people.map((p,i)=>({p,i})).filter(({p,i})=>filter==='Online'?p.status==='Online':filter==='Favoritos'?liked.has(i):true).map(({p,i})=>card(p,i)).join('')}</div></section><section class="section matchpanel"><div class="matchpaneltop"><div><div class="eyebrow">ENCONTRO ALEATÓRIO</div><h2 style="margin-top:7px">Deixe a próxima conversa surpreender</h2></div><div class="big">↗</div></div><p class="sub">Entre na fila de descoberta e encontre uma nova conexão.</p><button class="btn" onclick="startSearch()">Começar a buscar</button></section><div class="footerhint">PRIVE CHAT · 18+ · Respeito e privacidade sempre</div>`}function renderCalls(){return `<div class="pagehead"><div><div class="eyebrow">CONECTE-SE AO VIVO</div><h1>Chamadas</h1><p class="sub">Escolha um perfil ou encontre alguém aleatoriamente.</p></div><button class="iconbtn" onclick="simulateIncoming()">♧</button></div><section class="callhero"><div class="eyebrow">PRONTO PARA CONECTAR?</div><div class="orb"><span class="logo">P.</span></div><h2>Uma conversa começa com um toque.</h2><p class="sub">Busque novas pessoas e descubra com quem vai conversar.</p><div class="metric"><div><b>18+</b><span>Somente adultos</span></div><div><b>1 toque</b><span>Para começar</span></div><div><b>Você</b><span>No controle</span></div></div><button class="btn" onclick="startSearch()">⌕ &nbsp; INICIAR BUSCA</button><button class="btn ghost" onclick="simulateIncoming()">Testar notificação de chamada</button></section><section class="section"><div class="sectionline"><h2>Disponíveis agora</h2><span class="muted" style="font-size:12px">${people.filter(p=>p.status==='Online').length} perfis</span></div><div class="list">${people.filter(p=>p.status==='Online').map((p)=>`<button class="chatrow" onclick="callPerson('${p.name}')">${img(p)}<div class="chatmeta"><b>${p.name}, ${p.age} <span class="live"></span></b><p>${p.loc}</p></div><span class="btn" style="padding:10px 12px;font-size:12px">Ligar</span></button>`).join('')}</div></section>`}function renderMessages(){return `<div class="pagehead"><div><div class="eyebrow">SUAS CONEXÕES</div><h1>Mensagens</h1><p class="sub">Continue de onde a conversa parou.</p></div><button class="iconbtn" onclick="showToast('Mensagens atualizadas')">↻</button></div><div class="list">${people.slice(0,4).map((p,i)=>`<button class="chatrow" onclick="openChat(${i})">${img(p)}<div class="chatmeta"><b>${p.name} <span style="color:var(--gold);font-size:11px">${i===0?'●':''}</span></b><p>${p.msg}</p></div><span class="time">${i===0?'Agora':i===1?'10:44':'Ontem'}</span></button>`).join('')}</div><section class="section matchpanel"><h2>Conheça novas pessoas</h2><p class="sub">Ainda não conversou com alguém? Descubra um novo perfil.</p><button class="btn" onclick="setTab('home')">Explorar perfis</button></section><div class="footerhint">As conversas mostradas são uma prévia visual. Mensagens entre usuários precisam de backend.</div>`}function renderProfile(){return `<section class="profilehead">${img({name:'Seu perfil',img:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80'},'bigavatar')}<h2>Seu perfil PRIVE</h2><p class="sub">Complete sua conta para personalizar sua experiência.</p><button class="btn ghost" style="margin-top:14px" onclick="showToast('A edição de perfil será ativada com a conta conectada.')">✎ &nbsp; Editar perfil</button><div class="stats"><div><b>0</b><span>Amigos</span></div><div><b>${liked.size}</b><span>Favoritos</span></div><div><b>0</b><span>Seguindo</span></div></div></section><button class="tile" onclick="showToast('A área de bônus será conectada ao sistema de conta.')"><span class="tileicon">🎁</span><span class="desc"><b>Bônus</b><small>Veja as recompensas disponíveis</small></span><b style="color:var(--gold)">Ver ›</b></button><button class="tile" onclick="openShop()"><span class="tileicon" style="background:#735222">◉</span><span class="desc"><b>Loja de moedas</b><small>Saldo atual: ${coins} moedas</small></span><b style="color:var(--gold)">Recarregar ›</b></button><button class="tile" onclick="showToast('A lista de visitantes exige uma conta conectada.')"><span class="tileicon">◉</span><span class="desc"><b>Visitantes</b><small>Veja quem visitou seu perfil</small></span><span class="arrow">›</span></button><button class="tile" onclick="showToast('Se precisar de ajuda, configure aqui seu canal de atendimento.')"><span class="tileicon">♫</span><span class="desc"><b>Atendimento ao cliente</b><small>Ajuda e suporte</small></span><span class="arrow">›</span></button><button class="tile" onclick="showToast('Configurações de privacidade em breve.')"><span class="tileicon">⚙</span><span class="desc"><b>Privacidade e configurações</b><small>Controle sua experiência</small></span><span class="arrow">›</span></button><div class="footerhint">PRIVE CHAT · Conteúdo exclusivo para maiores de 18 anos</div>`}function render(){content.innerHTML=tab==='home'?renderHome():tab==='calls'?renderCalls():tab==='messages'?renderMessages():renderProfile();document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('coins').textContent=coins}function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));function setFilter(f){filter=f;render()}function toggleLike(i){liked.has(i)?liked.delete(i):liked.add(i);render()}function showToast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}function overlay(html){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeOverlay()">${html}</div>`}function closeOverlay(){document.getElementById('overlay').innerHTML=''}function startSearch(){if(searching)return;searching=true;overlay(`<div class="modal" style="text-align:center"><div class="orb" style="width:115px;height:115px;margin:12px auto"><span class="logo">P.</span></div><div class="eyebrow">BUSCANDO CONEXÃO</div><h2 style="margin-top:10px">Procurando alguém disponível…</h2><p id="searchtxt">Preparando sua próxima conversa.</p><button class="btn ghost" onclick="cancelSearch()">Cancelar busca</button></div>`);let n=0;window.searchTimer=setInterval(()=>{n++;const el=document.getElementById('searchtxt');if(el)el.textContent=['Buscando perfis disponíveis…','Quase lá… preparando a conexão.','Demonstração: nenhuma chamada real está conectada ainda.'][Math.min(n-1,2)];if(n>=3){clearInterval(window.searchTimer);searching=false;closeOverlay();showToast('Busca demonstrativa: conecte um serviço de chamadas para encontrar usuários reais.')}},1200)}function cancelSearch(){clearInterval(window.searchTimer);searching=false;closeOverlay()}function callPerson(name){overlay(`<div class="modal"><div class="eyebrow">SOLICITAÇÃO DE CHAMADA</div><h2 style="margin-top:8px">Ligar para ${name}?</h2><p>Esta é uma prévia interativa. Para tocar no dispositivo de outra pessoa, será necessário um backend de chamadas em tempo real.</p><button class="btn" onclick="closeOverlay();showToast('A chamada real ainda não está conectada.')">Solicitar chamada</button><button class="btn ghost" onclick="closeOverlay()">Cancelar</button></div>`)}function simulateIncoming(){const p=people[1];overlay(`<div class="modal"><div class="eyebrow">CHAMADA RECEBIDA · DEMONSTRAÇÃO</div><div class="incoming">${img(p,'')}<div class="caller"><b>${p.name}, ${p.age}</b><small>Está tentando ligar para você…</small></div><span class="live"></span></div><p>Essa notificação demonstra o layout. Chamadas reais e notificações com o site fechado exigem serviço de chamadas, permissões e configuração de notificações.</p><div class="callactions"><button class="decline" onclick="closeOverlay();showToast('Chamada recusada (demonstração).')">✕ Recusar</button><button class="accept" onclick="closeOverlay();showToast('Aceitar chamada real requer a integração de vídeo.')">☎ Aceitar</button></div></div>`)}function openChat(i){chatPerson=people[i];overlay(`<div class="modal"><div style="display:flex;align-items:center;gap:12px">${img(chatPerson)}<div><h2>${chatPerson.name}, ${chatPerson.age}</h2><small class="muted">${chatPerson.status}</small></div><button class="iconbtn" style="margin-left:auto" onclick="closeOverlay()">×</button></div><div id="chatbody" style="margin:18px 0;max-height:220px;overflow:auto"><div class="chatbubble">${chatPerson.msg}</div></div><form onsubmit="sendChat(event)" style="display:flex;gap:8px"><input class="field" id="chatinput" placeholder="Escreva uma mensagem…" style="margin:0;min-width:0"><button class="btn" style="padding:0 15px">➤</button></form><p class="muted" style="font-size:10px">Prévia visual: mensagens ainda não são enviadas a outros usuários.</p></div>`)}function sendChat(e){e.preventDefault();const input=document.getElementById('chatinput'),body=document.getElementById('chatbody');if(!input.value.trim())return;body.innerHTML+=`<div class="chatbubble mine">${input.value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div>`;input.value='';body.scrollTop=body.scrollHeight}function openShop(){overlay(`<div class="modal"><div style="display:flex;align-items:center;justify-content:space-between"><div><div class="eyebrow">PRIVE STORE</div><h2 style="margin-top:6px">Loja de moedas</h2></div><button class="iconbtn" onclick="closeOverlay()">×</button></div><p>Seu saldo: <b style="color:var(--gold)">${coins} moedas</b></p><div class="tile"><span class="tileicon">◉</span><span class="desc"><b>40 moedas</b><small>Pacote inicial</small></span><button class="btn" onclick="buyCoins(40)" style="padding:10px 12px">R$ 12,90</button></div><div class="tile"><span class="tileicon">◉</span><span class="desc"><b>140 moedas</b><small>Mais escolhido</small></span><button class="btn" onclick="buyCoins(140)" style="padding:10px 12px">R$ 14,90</button></div><div class="tile"><span class="tileicon">◉</span><span class="desc"><b>600 moedas</b><small>Pacote premium</small></span><button class="btn" onclick="buyCoins(600)" style="padding:10px 12px">R$ 99,90</button></div><p class="muted" style="font-size:10px">Valores ilustrativos. O pagamento precisa ser ligado ao checkout real antes de vender.</p></div>`)}function buyCoins(n){closeOverlay();showToast('Checkout não conectado. Nenhuma moeda foi cobrada ou adicionada.')}render();
</script></body></html>
