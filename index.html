/* PRIVE visual refinement */
body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.012em}
h1,h2,h3,.pagehead h1{font-family:Manrope,"DM Sans",sans-serif;letter-spacing:-.04em;font-weight:650}
.logo{overflow:hidden;background:rgba(255,244,229,.06);border:1px solid rgba(231,191,112,.28);box-shadow:0 6px 22px rgba(0,0,0,.22)}
.logo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.orb .logo{border-radius:28px}
.bottomnav{padding:9px 8px max(9px,env(safe-area-inset-bottom));gap:5px;background:rgba(24,10,17,.92);border:1px solid rgba(231,191,112,.18);box-shadow:0 -8px 35px rgba(0,0,0,.25);backdrop-filter:blur(22px)}
.navitem{min-width:0;gap:5px;padding:9px 3px;border-radius:14px;font-size:10px;font-weight:600;letter-spacing:.005em;transition:background .18s,color .18s,transform .18s}
.navitem .ni{width:27px;height:25px;display:grid;place-items:center;font-size:0;line-height:1}
.navitem .ni svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.navitem.active{color:var(--gold);background:linear-gradient(145deg,rgba(111,36,61,.45),rgba(231,191,112,.08));font-weight:700}
.navitem.active .ni svg{transform:translateY(-1px);stroke-width:2}
.navitem:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.pagehead h1{font-size:clamp(29px,7vw,37px);line-height:1.12;margin:5px 0 8px}
.pagehead .sub,.sub{font-size:13px;line-height:1.65;letter-spacing:0;color:var(--muted);font-weight:400}
.btn{font-family:Manrope,sans-serif;font-size:12px;letter-spacing:.045em;font-weight:750}
.tile .desc b,.chatmeta b{font-size:13px;font-weight:650;letter-spacing:-.02em}
.tile .desc small,.chatmeta p{font-size:11px;line-height:1.5;font-weight:400}
.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:750}
@media(max-width:420px){.bottomnav{left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));}.navitem{font-size:9px}.navitem .ni svg{width:22px;height:22px}}

const people=[{name:'Marina',age:22,loc:'São Paulo, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=85',msg:'Oi! Tudo bem?'},{name:'Lívia',age:24,loc:'Campinas, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=85',msg:'Vamos conversar? 💬'},{name:'Helena',age:21,loc:'Santos, Brasil',status:'Ocupado',img:'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=700&q=85',msg:'Acabei de chegar por aqui'},{name:'Clara',age:23,loc:'Rio de Janeiro, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=700&q=85',msg:'Adorei te conhecer 😊'},{name:'Isabela',age:25,loc:'Curitiba, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=700&q=85',msg:'Oi, tudo bem?'},{name:'Júlia',age:20,loc:'Belo Horizonte, Brasil',status:'Online',img:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=700&q=85',msg:'Bora conversar ✨'}];let tab='home',filter='Todos',coins=0,liked=new Set(),searching=false,chatPerson=null,chatMessages=[];const content=document.getElementById('content');function img(p,cls='avatar'){return `<img class="${cls}" src="${p.img}" alt="Foto de perfil de ${p.name}" loading="lazy">`}function card(p,i){return `<article class="profile">${img(p,'')}<span class="status">${p.status}</span><button class="heart" onclick="toggleLike(${i})">${liked.has(i)?'♥':'♡'}</button><div class="pinfo"><div class="pname">${p.name}, ${p.age}</div><div class="ploc">⌖ ${p.loc}</div><button class="mini" onclick="openChat(${i})">Enviar mensagem ↗</button></div></article>`}function renderHome(){return `<section class="hero"><div class="eyebrow"><span class="live"></span> CONEXÕES PARA ACONTECER</div><h1>Conheça alguém novo.<br><span style="color:var(--gold)">No seu ritmo.</span></h1><p>Encontre perfis, comece uma conversa ou entre na busca por uma videochamada. Uma experiência feita para você.</p><button class="btn" onclick="startSearch()">▣ &nbsp; Encontrar videochamada &nbsp; ↗</button><div class="proof"><div class="avatars"><span>M</span><span>L</span><span>H</span><span>+</span></div><span><span class="live"></span> Pessoas descobrindo novas conexões</span></div></section><section class="section"><div class="sectionline"><h2>Pessoas para conhecer</h2><button class="textbtn" onclick="setTab('calls')">Ver chamadas →</button></div><div class="filters">${['Todos','Online','Perto de mim','Favoritos'].map(f=>`<button class="filter ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div><div class="cards">${people.map((p,i)=>({p,i})).filter(({p,i})=>filter==='Online'?p.status==='Online':filter==='Favoritos'?liked.has(i):true).map(({p,i})=>card(p,i)).join('')}</div></section><section class="section matchpanel"><div class="matchpaneltop"><div><div class="eyebrow">ENCONTRO ALEATÓRIO</div><h2 style="margin-top:7px">Deixe a próxima conversa surpreender</h2></div><div class="big">↗</div></div><p class="sub">Entre na fila de descoberta e encontre uma nova conexão.</p><button class="btn" onclick="startSearch()">Começar a buscar</button></section><div class="footerhint">PRIVE CHAT · 18+ · Respeito e privacidade sempre</div>`}function renderCalls(){return `<div class="pagehead"><div><div class="eyebrow">CONECTE-SE AO VIVO</div><h1>Chamadas</h1><p class="sub">Escolha um perfil ou encontre alguém aleatoriamente.</p></div><button class="iconbtn" onclick="simulateIncoming()">♧</button></div><section class="callhero"><div class="eyebrow">PRONTO PARA CONECTAR?</div><div class="orb"><span class="logo"><img src="${OFFICIAL_LOGO}" alt="Logo oficial PRIVE CHAT"></span></div><h2>Uma conversa começa com um toque.</h2><p class="sub">Busque novas pessoas e descubra com quem vai conversar.</p><div class="metric"><div><b>18+</b><span>Somente adultos</span></div><div><b>1 toque</b><span>Para começar</span></div><div><b>Você</b><span>No controle</span></div></div><button class="btn" onclick="startSearch()">⌕ &nbsp; INICIAR BUSCA</button><button class="btn ghost" onclick="simulateIncoming()">Testar notificação de chamada</button></section><section class="section"><div class="sectionline"><h2>Disponíveis agora</h2><span class="muted" style="font-size:12px">${people.filter(p=>p.status==='Online').length} perfis</span></div><div class="list">${people.filter(p=>p.status==='Online').map((p)=>`<button class="chatrow" onclick="callPerson('${p.name}')">${img(p)}<div class="chatmeta"><b>${p.name}, ${p.age} <span class="live"></span></b><p>${p.loc}</p></div><span class="btn" style="padding:10px 12px;font-size:12px">Ligar</span></button>`).join('')}</div></section>`}function renderMessages(){return `<div class="pagehead"><div><div class="eyebrow">SUAS CONEXÕES</div><h1>Mensagens</h1><p class="sub">Continue de onde a conversa parou.</p></div><button class="iconbtn" onclick="showToast('Mensagens atualizadas')">↻</button></div><div class="list">${people.slice(0,4).map((p,i)=>`<button class="chatrow" onclick="openChat(${i})">${img(p)}<div class="chatmeta"><b>${p.name} <span style="color:var(--gold);font-size:11px">${i===0?'●':''}</span></b><p>${p.msg}</p></div><span class="time">${i===0?'Agora':i===1?'10:44':'Ontem'}</span></button>`).join('')}</div><section class="section matchpanel"><h2>Conheça novas pessoas</h2><p class="sub">Ainda não conversou com alguém? Descubra um novo perfil.</p><button class="btn" onclick="setTab('home')">Explorar perfis</button></section><div class="footerhint">As conversas mostradas são uma prévia visual. Mensagens entre usuários precisam de backend.</div>`}function renderProfile(){return `<section class="profilehead">${img({name:'Seu perfil',img:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80'},'bigavatar')}<h2>Seu perfil PRIVE</h2><p class="sub">Complete sua conta para personalizar sua experiência.</p><button class="btn ghost" style="margin-top:14px" onclick="showToast('A edição de perfil será ativada com a conta conectada.')">✎ &nbsp; Editar perfil</button><div class="stats"><div><b>0</b><span>Amigos</span></div><div><b>${liked.size}</b><span>Favoritos</span></div><div><b>0</b><span>Seguindo</span></div></div></section><button class="tile" onclick="showToast('A área de bônus será conectada ao sistema de conta.')"><span class="tileicon">🎁</span><span class="desc"><b>Bônus</b><small>Veja as recompensas disponíveis</small></span><b style="color:var(--gold)">Ver ›</b></button><button class="tile" onclick="openShop()"><span class="tileicon" style="background:#735222">◉</span><span class="desc"><b>Loja de moedas</b><small>Saldo atual: ${coins} moedas</small></span><b style="color:var(--gold)">Recarregar ›</b></button><button class="tile" onclick="showToast('A lista de visitantes exige uma conta conectada.')"><span class="tileicon">◉</span><span class="desc"><b>Visitantes</b><small>Veja quem visitou seu perfil</small></span><span class="arrow">›</span></button><button class="tile" onclick="showToast('Se precisar de ajuda, configure aqui seu canal de atendimento.')"><span class="tileicon">♫</span><span class="desc"><b>Atendimento ao cliente</b><small>Ajuda e suporte</small></span><span class="arrow">›</span></button><button class="tile" onclick="showToast('Configurações de privacidade em breve.')"><span class="tileicon">⚙</span><span class="desc"><b>Privacidade e configurações</b><small>Controle sua experiência</small></span><span class="arrow">›</span></button><div class="footerhint">PRIVE CHAT · Conteúdo exclusivo para maiores de 18 anos</div>`}function render(){content.innerHTML=tab==='home'?renderHome():tab==='calls'?renderCalls():tab==='messages'?renderMessages():renderProfile();document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('coins').textContent=coins}function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));function setFilter(f){filter=f;render()}function toggleLike(i){liked.has(i)?liked.delete(i):liked.add(i);render()}function showToast(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}function overlay(html){document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeOverlay()">${html}</div>`}function closeOverlay(){document.getElementById('overlay').innerHTML=''}function startSearch(){if(searching)return;searching=true;overlay(`<div class="modal" style="text-align:center"><div class="orb" style="width:115px;height:115px;margin:12px auto"><span class="logo"><img src="${OFFICIAL_LOGO}" alt="Logo oficial PRIVE CHAT"></span></div><div class="eyebrow">BUSCANDO CONEXÃO</div><h2 style="margin-top:10px">Procurando alguém disponível…</h2><p id="searchtxt">Preparando sua próxima conversa.</p><button class="btn ghost" onclick="cancelSearch()">Cancelar busca</button></div>`);let n=0;window.searchTimer=setInterval(()=>{n++;const el=document.getElementById('searchtxt');if(el)el.textContent=['Buscando perfis disponíveis…','Quase lá… preparando a conexão.','Demonstração: nenhuma chamada real está conectada ainda.'][Math.min(n-1,2)];if(n>=3){clearInterval(window.searchTimer);searching=false;closeOverlay();showToast('Busca demonstrativa: conecte um serviço de chamadas para encontrar usuários reais.')}},1200)}function cancelSearch(){clearInterval(window.searchTimer);searching=false;closeOverlay()}function callPerson(name){overlay(`<div class="modal"><div class="eyebrow">SOLICITAÇÃO DE CHAMADA</div><h2 style="margin-top:8px">Ligar para ${name}?</h2><p>Esta é uma prévia interativa. Para tocar no dispositivo de outra pessoa, será necessário um backend de chamadas em tempo real.</p><button class="btn" onclick="closeOverlay();showToast('A chamada real ainda não está conectada.')">Solicitar chamada</button><button class="btn ghost" onclick="closeOverlay()">Cancelar</button></div>`)}function simulateIncoming(){const p=people[1];overlay(`<div class="modal"><div class="eyebrow">CHAMADA RECEBIDA · DEMONSTRAÇÃO</div><div class="incoming">${img(p,'')}<div class="caller"><b>${p.name}, ${p.age}</b><small>Está tentando ligar para você…</small></div><span class="live"></span></div><p>Essa notificação demonstra o layout. Chamadas reais e notificações com o site fechado exigem serviço de chamadas, permissões e configuração de notificações.</p><div class="callactions"><button class="decline" onclick="closeOverlay();showToast('Chamada recusada (demonstração).')">✕ Recusar</button><button class="accept" onclick="closeOverlay();showToast('Aceitar chamada real requer a integração de vídeo.')">☎ Aceitar</button></div></div>`)}function openChat(i){chatPerson=people[i];overlay(`<div class="modal"><div style="display:flex;align-items:center;gap:12px">${img(chatPerson)}<div><h2>${chatPerson.name}, ${chatPerson.age}</h2><small class="muted">${chatPerson.status}</small></div><button class="iconbtn" style="margin-left:auto" onclick="closeOverlay()">×</button></div><div id="chatbody" style="margin:18px 0;max-height:220px;overflow:auto"><div class="chatbubble">${chatPerson.msg}</div></div><form onsubmit="sendChat(event)" style="display:flex;gap:8px"><input class="field" id="chatinput" placeholder="Escreva uma mensagem…" style="margin:0;min-width:0"><button class="btn" style="padding:0 15px">➤</button></form><p class="muted" style="font-size:10px">Prévia visual: mensagens ainda não são enviadas a outros usuários.</p></div>`)}function sendChat(e){e.preventDefault();const input=document.getElementById('chatinput'),body=document.getElementById('chatbody');if(!input.value.trim())return;body.innerHTML+=`<div class="chatbubble mine">${input.value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div>`;input.value='';body.scrollTop=body.scrollHeight}function openShop(){overlay(`<div class="modal"><div style="display:flex;align-items:center;justify-content:space-between"><div><div class="eyebrow">PRIVE STORE</div><h2 style="margin-top:6px">Loja de moedas</h2></div><button class="iconbtn" onclick="closeOverlay()">×</button></div><p>Seu saldo: <b style="color:var(--gold)">${coins} moedas</b></p><div class="tile"><span class="tileicon">◉</span><span class="desc"><b>40 moedas</b><small>Pacote inicial</small></span><button class="btn" onclick="buyCoins(40)" style="padding:10px 12px">R$ 12,90</button></div><div class="tile"><span class="tileicon">◉</span><span class="desc"><b>140 moedas</b><small>Mais escolhido</small></span><button class="btn" onclick="buyCoins(140)" style="padding:10px 12px">R$ 14,90</button></div><div class="tile"><span class="tileicon">◉</span><span class="desc"><b>600 moedas</b><small>Pacote premium</small></span><button class="btn" onclick="buyCoins(600)" style="padding:10px 12px">R$ 99,90</button></div><p class="muted" style="font-size:10px">Valores ilustrativos. O pagamento precisa ser ligado ao checkout real antes de vender.</p></div>`)}function buyCoins(n){closeOverlay();showToast('Checkout não conectado. Nenhuma moeda foi cobrada ou adicionada.')}

const ADMIN_USER='eliasprofissional05@gmail.com'; const ADMIN_PASS='Juliete2010.';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadAdminPeople(){try{const saved=JSON.parse(localStorage.getItem('prive_admin_people')||'null');if(Array.isArray(saved)&&saved.length){people.splice(0,people.length,...saved)}}catch(e){}}
function saveAdminPeople(){localStorage.setItem('prive_admin_people',JSON.stringify(people));render();}
function openAdmin(){overlay(`<div class="modal admin-layout"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">ÁREA RESTRITA</div><h2>Painel administrativo</h2></div><button class="iconbtn" onclick="closeOverlay()" aria-label="Fechar">×</button></div><p class="admin-note">Gerencie os perfis que aparecem na página inicial.</p><form onsubmit="adminLogin(event)"><label for="adminemail">E-mail do administrador</label><input id="adminemail" class="field" type="email" autocomplete="username" required placeholder="admin@privechat.com"><label for="adminpass">Senha</label><input id="adminpass" class="field" type="password" autocomplete="current-password" required placeholder="Sua senha"><button class="btn" style="width:100%;margin-top:10px">Entrar no painel</button></form><p class="admin-note">Aviso: esta versão é um protótipo front-end. A autenticação no navegador não é segura para produção.</p></div>`)}
function adminLogin(e){e.preventDefault();const email=document.getElementById('adminemail').value.trim().toLowerCase(),pass=document.getElementById('adminpass').value;if(email!==ADMIN_USER.toLowerCase()||pass!==ADMIN_PASS){showToast('E-mail ou senha inválidos.');return}renderAdminPanel()}
function renderAdminPanel(editIndex=-1){const p=editIndex>=0?people[editIndex]:{name:'',age:18,loc:'',status:'Online',img:'',msg:''};overlay(`<div class="modal admin-layout"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">GESTÃO DE PERFIS</div><h2>Usuários do PRIVE</h2></div><button class="iconbtn" onclick="closeOverlay()" aria-label="Fechar">×</button></div><p class="admin-note">${people.length} perfis cadastrados. Salvar atualiza os cards nesta instalação do navegador.</p><form onsubmit="saveAdminUser(event,${editIndex})"><div class="admin-grid"><div><label>Nome</label><input class="field" id="au-name" required maxlength="60" value="${esc(p.name)}" placeholder="Mariana Silveira"></div><div><label>Idade (18+)</label><input class="field" id="au-age" type="number" min="18" max="99" required value="${esc(p.age)}"></div></div><label>Localização</label><input class="field" id="au-loc" required maxlength="100" value="${esc(p.loc)}" placeholder="São Luís, Maranhão"><div class="admin-grid"><div><label>Status</label><select class="field" id="au-status"><option ${p.status==='Online'?'selected':''}>Online</option><option ${p.status==='Ocupado'?'selected':''}>Ocupado</option><option ${p.status==='Offline'?'selected':''}>Offline</option></select></div><div><label>Foto (URL)</label><input class="field" id="au-img" type="url" value="${esc(p.img)}" placeholder="https://..."></div></div><label>Ou enviar uma foto do dispositivo</label><input class="field" id="au-file" type="file" accept="image/*"><label>Texto de apresentação</label><input class="field" id="au-msg" maxlength="140" value="${esc(p.msg)}" placeholder="Oi! Vamos conversar?"><div class="admin-actions"><button class="btn" type="submit">${editIndex>=0?'Salvar alterações':'Adicionar usuário'}</button><button class="btn ghost" type="button" onclick="renderAdminList()">Ver usuários</button></div></form><div id="admin-list"></div><p class="admin-note">Não use URLs de fotos sem autorização. Dados e imagens ficam apenas neste navegador até integrar um banco de dados.</p></div>`)}
function saveAdminUser(e,index){e.preventDefault();const file=document.getElementById('au-file').files[0];const commit=(image)=>{const user={name:document.getElementById('au-name').value.trim(),age:Number(document.getElementById('au-age').value),loc:document.getElementById('au-loc').value.trim(),status:document.getElementById('au-status').value,img:image||document.getElementById('au-img').value.trim()||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=85',msg:document.getElementById('au-msg').value.trim()};if(user.age<18){showToast('Todos os perfis precisam ser maiores de 18 anos.');return}if(index>=0)people[index]=user;else people.push(user);try{saveAdminPeople();renderAdminPanel(-1);showToast(index>=0?'Perfil atualizado.':'Usuário adicionado.')}catch(err){showToast('Não foi possível salvar. A imagem pode ser muito grande.')}};if(file){const reader=new FileReader();reader.onload=()=>commit(reader.result);reader.onerror=()=>showToast('Não foi possível ler a foto.');reader.readAsDataURL(file)}else commit(index>=0&&people[index].img?people[index].img:'')}
function renderAdminList(){const host=document.getElementById('admin-list');if(!host)return;host.innerHTML='<div class="admin-list">'+people.map((p,i)=>`<div class="admin-user"><img src="${esc(p.img)}" alt=""><div class="grow"><b>${esc(p.name)}, ${esc(p.age)}</b><small>${esc(p.loc)} · ${esc(p.status)}</small></div><button class="btn ghost" onclick="renderAdminPanel(${i})">Editar</button><button class="btn ghost" onclick="deleteAdminUser(${i})">Excluir</button></div>`).join('')+'</div>'}
function deleteAdminUser(i){if(!confirm('Excluir o perfil '+people[i].name+'?'))return;people.splice(i,1);saveAdminPeople();renderAdminPanel(-1);showToast('Perfil removido desta instalação.')}
loadAdminPeople();
render();

// PRIVE CHAT: cadastro de modelos, vídeos gravados e conta de acesso (protótipo local).
// Para produção multiusuário, conectar autenticação e mídia ao backend/Blob; IndexedDB é local ao navegador.
const MEDIA_DB='prive-chat-media-v1', MEDIA_STORE='videos';
function mediaDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(MEDIA_DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(MEDIA_STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function putVideo(id,blob){const db=await mediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put(blob,id);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)})}
async function getVideo(id){if(!id)return null;try{const db=await mediaDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readonly'),r=tx.objectStore(MEDIA_STORE).get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}}
async function deleteVideo(id){if(!id)return;try{const db=await mediaDB();const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).delete(id)}catch(e){}}
function loadAdminPeople(){try{const saved=JSON.parse(localStorage.getItem('prive_admin_people')||'null');if(Array.isArray(saved)&&saved.length){people.splice(0,people.length,...saved)}else if(Array.isArray(saved)){people.splice(0,people.length)}}catch(e){}}
function saveAdminPeople(){localStorage.setItem('prive_admin_people',JSON.stringify(people));render();}
function renderAdminPanel(editIndex=-1){const p=editIndex>=0?people[editIndex]:{name:'',age:18,loc:'',status:'Online',img:'',msg:'',videoId:''};overlay(`<div class="modal admin-layout"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">GESTÃO DE MODELOS</div><h2>${editIndex>=0?'Editar modelo':'Criar novo modelo'}</h2></div><button class="iconbtn" onclick="closeOverlay()" aria-label="Fechar">×</button></div><p class="admin-note">Cada modelo reúne foto, dados e vídeo de chamada. Não há limite fixo no formulário; o armazenamento disponível é que limita os arquivos.</p><form onsubmit="saveAdminUser(event,${editIndex})"><label>Nome completo</label><input class="field" id="au-name" required maxlength="80" value="${esc(p.name)}" placeholder="Mariana Silveira"><div class="admin-grid"><div><label>Idade (18+)</label><input class="field" id="au-age" type="number" min="18" max="99" required value="${esc(p.age)}"></div><div><label>Status</label><select class="field" id="au-status"><option ${p.status==='Online'?'selected':''}>Online</option><option ${p.status==='Ocupado'?'selected':''}>Ocupado</option><option ${p.status==='Offline'?'selected':''}>Offline</option></select></div></div><label>Localização</label><input class="field" id="au-loc" required maxlength="100" value="${esc(p.loc)}" placeholder="São Luís, Maranhão"><label>Foto do perfil (URL, opcional)</label><input class="field" id="au-img" type="url" value="${esc(p.img)}" placeholder="https://..."><label>Ou anexar foto do dispositivo</label><input class="field" id="au-file" type="file" accept="image/*"><label>Vídeo da chamada (MP4, WebM ou MOV)</label><input class="field" id="au-video" type="file" accept="video/mp4,video/webm,video/quicktime,video/*" ${editIndex<0?'required':''}><small class="admin-note">${p.videoId?'Já existe um vídeo associado. Selecione outro para substituí-lo.':'Anexe o vídeo que será reproduzido quando este perfil for selecionado.'}</small><label>Apresentação</label><input class="field" id="au-msg" maxlength="160" value="${esc(p.msg)}" placeholder="Uma breve apresentação"><div class="admin-actions"><button class="btn" type="submit">${editIndex>=0?'Salvar modelo':'Criar novo modelo'}</button><button class="btn ghost" type="button" onclick="renderAdminList()">Ver modelos</button></div></form><div id="admin-list"></div><p class="admin-note">Protótipo: vídeos e contas ficam neste navegador. Para compartilhar entre visitantes, é necessário ligar o upload ao armazenamento remoto e ao banco.</p></div>`)}
async function saveAdminUser(e,index){e.preventDefault();const form=e.currentTarget;const photoFile=document.getElementById('au-file').files[0],videoFile=document.getElementById('au-video').files[0];const old=index>=0?people[index]:{};const base={name:document.getElementById('au-name').value.trim(),age:Number(document.getElementById('au-age').value),loc:document.getElementById('au-loc').value.trim(),status:document.getElementById('au-status').value,img:document.getElementById('au-img').value.trim()||old.img||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=85',msg:document.getElementById('au-msg').value.trim(),videoId:old.videoId||''};if(base.age<18){showToast('Todos os perfis precisam ter 18 anos ou mais.');return}if(!old.videoId&&!videoFile){showToast('Anexe um vídeo de chamada para este modelo.');return}if(videoFile&&videoFile.size>250*1024*1024){showToast('O vídeo excede 250 MB para este protótipo local.');return}const savePhoto=()=>new Promise((resolve)=>{if(!photoFile)return resolve(base.img);const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(base.img);r.readAsDataURL(photoFile)});try{base.img=await savePhoto();if(videoFile){const id='video_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);await putVideo(id,videoFile);if(old.videoId)await deleteVideo(old.videoId);base.videoId=id;base.videoName=videoFile.name}if(index>=0)people[index]=base;else people.push(base);localStorage.setItem('prive_admin_people',JSON.stringify(people));render();renderAdminPanel(-1);showToast(index>=0?'Modelo atualizado.':'Modelo criado.')}catch(err){console.error(err);showToast('Não foi possível salvar. Confira o espaço disponível no dispositivo.')}}
function renderAdminList(){const host=document.getElementById('admin-list');if(!host)return;host.innerHTML='<div class="admin-list">'+people.map((p,i)=>`<div class="admin-user"><img src="${esc(p.img)}" alt=""><div class="grow"><b>${esc(p.name)}, ${esc(p.age)}</b><small>${esc(p.loc)} · ${esc(p.status)} · ${p.videoId?'Vídeo anexado':'Sem vídeo'}</small></div><button class="btn ghost" onclick="renderAdminPanel(${i})">Editar</button><button class="btn ghost" onclick="deleteAdminUser(${i})">Excluir</button></div>`).join('')+'</div>'}
async function deleteAdminUser(i){if(!confirm('Excluir o modelo '+people[i].name+'?'))return;await deleteVideo(people[i].videoId);people.splice(i,1);localStorage.setItem('prive_admin_people',JSON.stringify(people));render();renderAdminPanel(-1);showToast('Modelo removido.');}
function startSearch(){if(searching)return;const candidates=people.filter(p=>p.status!=='Offline'&&p.videoId);if(!candidates.length){showToast('Ainda não há modelos com vídeo disponível. Cadastre um modelo no painel administrativo.');return}searching=true;overlay(`<div class="modal" style="text-align:center"><div class="orb" style="width:115px;height:115px;margin:12px auto"><span class="logo"><img src="${OFFICIAL_LOGO}" alt="PRIVE CHAT"></span></div><div class="eyebrow">ENCONTRANDO UM PERFIL</div><h2 style="margin-top:10px">Procurando uma conexão…</h2><p id="searchtxt">Selecionando entre os perfis disponíveis.</p><button class="btn ghost" onclick="cancelSearch()">Cancelar</button></div>`);const delay=1200+Math.random()*1800;window.searchTimer=setTimeout(()=>{searching=false;closeOverlay();const available=people.filter(p=>p.status!=='Offline'&&p.videoId);if(!available.length){showToast('Não há vídeos disponíveis no momento.');return}const pick=available[Math.floor(Math.random()*available.length)];openRecordedCall(pick)},delay)}
function cancelSearch(){clearTimeout(window.searchTimer);searching=false;closeOverlay()}
async function openRecordedCall(p){const blob=await getVideo(p.videoId);if(!blob){showToast('Não foi possível carregar o vídeo. Reanexe-o no painel administrativo.');return}const url=URL.createObjectURL(blob);overlay(`<div class="modal" style="padding:14px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div><div class="eyebrow">PRIVE CHAT</div><h2 style="margin-top:5px">${esc(p.name)}, ${esc(p.age)}</h2><small class="muted">${esc(p.loc)}</small></div><button class="iconbtn" onclick="endRecordedCall()" aria-label="Encerrar">×</button></div><div class="video-call"><video id="recorded-model-video" controls autoplay playsinline src="${url}"></video><div class="self-preview" id="self-preview">Sua câmera<br><small>Ativar câmera</small></div><div class="call-overlay"><div class="call-label">Vídeo gravado · ${esc(p.name)}</div><button class="decline" onclick="endRecordedCall()" style="border-radius:50%;width:48px;height:48px">☎</button></div></div><p class="admin-note">Este perfil utiliza um vídeo gravado, não uma transmissão ao vivo.</p><button class="btn ghost" onclick="enableSelfCamera()">Ativar minha câmera</button></div>`);window.activeCallUrl=url;const v=document.getElementById('recorded-model-video');if(v){v.onended=()=>showToast('O vídeo terminou. Você pode encerrar ou iniciar outra busca.');v.play().catch(()=>{})}}
function endRecordedCall(){const url=window.activeCallUrl;closeOverlay();if(url)URL.revokeObjectURL(url);window.activeCallUrl=null;if(window.selfCameraStream){window.selfCameraStream.getTracks().forEach(t=>t.stop());window.selfCameraStream=null}}
async function enableSelfCamera(){try{const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});window.selfCameraStream=stream;const host=document.getElementById('self-preview');host.innerHTML='<video autoplay muted playsinline></video>';host.querySelector('video').srcObject=stream}catch(e){showToast('Não foi possível acessar a câmera. Verifique as permissões do navegador.')}}
function callPerson(name){const p=people.find(x=>x.name===name);if(p&&p.videoId){openRecordedCall(p);return}showToast('Este perfil ainda não tem vídeo de chamada cadastrado.')}
function simulateIncoming(){const candidates=people.filter(p=>p.videoId&&p.status!=='Offline');if(!candidates.length){showToast('Cadastre um modelo com vídeo para habilitar chamadas.');return}const p=candidates[Math.floor(Math.random()*candidates.length)];overlay(`<div class="modal"><div class="eyebrow">CHAMADA</div><div class="incoming">${img(p,'')}<div class="caller"><b>${esc(p.name)}, ${esc(p.age)}</b><small>${esc(p.loc)}</small></div><span class="live"></span></div><p>Um perfil está disponível para você. O conteúdo de chamada utiliza vídeo gravado.</p><div class="callactions"><button class="decline" onclick="closeOverlay()">✕ Recusar</button><button class="accept" onclick="closeOverlay();openRecordedCall(people.find(x=>x.name===${JSON.stringify(p.name)}))">▶ Assistir</button></div></div>`)}
function openUserAuth(mode='login'){overlay(`<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">SUA CONTA</div><h2 style="margin-top:6px">Entrar no PRIVE</h2></div><button class="iconbtn" onclick="closeOverlay()">×</button></div><div class="auth-switch"><button onclick="openUserAuth('login')">Entrar</button><button onclick="openUserAuth('register')">Criar conta</button><button onclick="quickLogin()">Acesso rápido</button></div><form onsubmit="userAuthSubmit(event,'${mode}')"><label>E-mail</label><input class="field" id="user-email" type="email" autocomplete="email" required placeholder="voce@exemplo.com"><label>Senha</label><input class="field" id="user-password" type="password" minlength="8" autocomplete="${mode==='register'?'new-password':'current-password'}" required placeholder="Mínimo de 8 caracteres"><button class="btn" style="width:100%">${mode==='register'?'Criar conta':'Entrar'}</button></form><p class="admin-note">Protótipo local: contas ficam apenas neste navegador e não devem usar senhas reais até a integração de autenticação segura no servidor.</p></div>`)}
function userAuthSubmit(e,mode){e.preventDefault();const email=document.getElementById('user-email').value.trim().toLowerCase(),pass=document.getElementById('user-password').value;let users={};try{users=JSON.parse(localStorage.getItem('prive_local_accounts')||'{}')}catch(e){}if(mode==='register'){if(users[email]){showToast('Este e-mail já está cadastrado neste navegador.');return}users[email]={password:pass,createdAt:Date.now()};localStorage.setItem('prive_local_accounts',JSON.stringify(users))}else if(!users[email]||users[email].password!==pass){showToast('E-mail ou senha incorretos neste navegador.');return}localStorage.setItem('prive_current_user',email);closeOverlay();showToast('Acesso realizado.');setTab('profile')}
function quickLogin(){const id='visitante_'+Math.random().toString(36).slice(2,9);localStorage.setItem('prive_current_user',id);closeOverlay();showToast('Você entrou com acesso rápido.');setTab('home')}

// Carrega modelos cadastrados neste navegador antes de renderizar a interface.
loadAdminPeople();render();

// === VÍNCULO NEON (somente funções de dados) ===
const API_BASE = '/api/models';

async function loadModelsFromNeon() {
  try {
    const res = await fetch(API_BASE);
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data) && data.length) {
      people.splice(0, people.length, ...data.map(m => ({
        name: m.name,
        age: m.age,
        loc: m.city,
        status: m.status || 'Online',
        img: m.photo_url || '',
        msg: '',
        videoId: m.video_url || '',
        id: m.id
      })));
      render();
    }
  } catch (e) { console.warn('Neon load failed', e); }
}

async function saveModelToNeon(model) {
  try {
    await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: model.name,
        age: model.age,
        city: model.loc,
        photo_url: model.img,
        video_url: model.videoId,
        status: model.status
      })
    });
  } catch (e) { console.warn('Neon save failed', e); }
}

// Carrega do Neon ao iniciar (se disponível)
if (typeof loadAdminPeople === 'function') {
  const originalLoad = loadAdminPeople;
  loadAdminPeople = async function() {
    originalLoad();
    await loadModelsFromNeon();
  };
}

</script></body></html>
