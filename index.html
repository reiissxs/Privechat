<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#45000d"><title>033SP | Canal no Telegram</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#8c1020,#370009 70%);color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif;text-align:center}main{max-width:540px;margin:auto;padding:22px 16px 90px}.tag{display:inline-block;border:1px solid #e5a83d;border-radius:99px;color:#ffe29b;padding:9px 18px;font-weight:800;font-size:13px;letter-spacing:1px}h1{font-size:clamp(31px,9vw,52px);line-height:1.05;margin:20px 0 10px;text-shadow:0 3px 0 #700600}h1 span{color:#ffd04e}p{font-size:16px;line-height:1.5;color:#ffe9dc}.hero{width:100%;max-width:440px;border-radius:18px;border:2px solid #ce862c;box-shadow:0 8px 30px #0008;margin:16px auto;display:block}.telegram{display:flex;justify-content:center;align-items:center;gap:12px;text-decoration:none;background:linear-gradient(#35baff,#0788d6);color:white;font-size:clamp(17px,5vw,23px);font-weight:900;padding:20px 14px;border-radius:18px;box-shadow:0 7px 0 #07558a,0 15px 32px #0008;margin:22px 0 18px;min-height:76px}.telegram svg{width:33px;height:33px;flex:none}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px 0}.card{background:#650c17;border:1px solid #b76e29;border-radius:14px;padding:18px 10px;font-weight:750;line-height:1.4}.card b{display:block;font-size:28px;margin-bottom:6px}.small{font-size:12px;color:#dcb9b5}.floating{position:fixed;bottom:18px;right:18px;background:#159bdc;border:2px solid white;width:62px;height:62px;display:grid;place-items:center;border-radius:50%;box-shadow:0 6px 20px #0008}.floating svg{width:34px;height:34px}.arrow{font-weight:900;color:#ffda64;animation:bounce 1.2s infinite;margin:18px 0 0}@keyframes bounce{50%{transform:translateY(8px)}}@media(min-width:700px){main{padding-top:42px}}</style></head><body><main><h1>ENTRE NO NOSSO <span>CANAL DO TELEGRAM!</span> 🚀</h1><p>🎰 Acompanhe informações sobre plataformas de jogos, bônus, promoções e novidades em um só lugar.</p><div class="arrow">👇 CLIQUE AQUI 👇</div><a class="telegram join" href="#" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.8 3.3 18.5 20c-.2 1.1-.9 1.4-1.8.9l-5.1-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.2L18 6.2c.4-.4-.1-.6-.6-.3L5.8 13.2l-5-1.6c-1.1-.3-1.1-1.1.2-1.6L20.5 2.5c.9-.3 1.6.2 1.3.8Z"/></svg>ENTRAR NO CANAL</a><img class="hero" src="banner.png" alt="033SP, mascotes tigre e coelho, convite para canal no Telegram"><div class="cards"><div class="card"><b>🎁</b>Bônus e promoções</div><div class="card"><b>🔔</b>Atualizações frequentes</div><div class="card"><b>🎮</b>Novidades dos jogos</div><div class="card"><b>📢</b>Informações em um canal</div></div><a class="telegram join" href="#" rel="noopener noreferrer">ENTRAR NO TELEGRAM</a></main><a class="floating join" href="#" aria-label="Abrir Telegram"><svg viewBox="0 0 24 24" fill="white"><path d="M21.8 3.3 18.5 20c-.2 1.1-.9 1.4-1.8.9l-5.1-3.8-2.5 2.4c-.3.3-.5.5-1 .5l.4-5.2L18 6.2c.4-.4-.1-.6-.6-.3L5.8 13.2l-5-1.6c-1.1-.3-1.1-1.1.2-1.6L20.5 2.5c.9-.3 1.6.2 1.3.8Z"/></svg></a><script>const LINK_TELEGRAM='';document.querySelectorAll('.join').forEach(a=>a.addEventListener('click',e=>{if(!LINK_TELEGRAM){e.preventDefault();alert('Configure o LINK_TELEGRAM no arquivo index.html');}else{a.href=LINK_TELEGRAM;a.target='_blank';}}));</script></body></html>
