<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRIVE CHAT</title>
<style>
:root{--bg:#10080d;--panel:#211018;--gold:#e7bf70;--cream:#fff4e5;--muted:#bcaab1;--line:#57303f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:system-ui,sans-serif;min-height:100dvh}
button,input,select{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
.app{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:80px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#160a11ee;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff0d}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}
.coin{background:#352218;border:1px solid #a67a3a88;color:var(--gold);border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px}
.page{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#211018;border:1px solid #ffffff10;border-radius:16px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover;display:block;background:#2a1520}
.card-info{padding:10px}
.card-info b{display:block;font-size:15px}
.card-info small{color:var(--muted);font-size:12px}
.online{display:inline-block;width:8px;height:8px;background:#45d7a1;border-radius:50%;margin-right:4px}
.btn{background:linear-gradient(110deg,#e8c87d,#c99949);color:#28141a;border-radius:12px;padding:12px 16px;font-weight:700;width:100%;margin-top:8px}
.btn.ghost{background:#ffffff0b;border:1px solid var(--line);color:var(--cream)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:#211018;border-radius:20px;padding:20px;max-width:400px;width:100%;max-height:90vh;overflow:auto}
.field{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff20;background:#ffffff08;color:white;margin:6px 0 12px}
label{font-size:13px;color:var(--muted)}
.admin-list{margin-top:16px}
.admin-item{background:#ffffff08;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 16px;border-radius:10px;z-index:200;display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">PRIVE CHAT</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="coin" id="coin-display">0 moedas</div>
      <button class="iconbtn" onclick="openAuth()" style="font-size:18px">👤</button>
    </div>
  </div>
  <div class="page" id="main"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const ADMIN_EMAIL = 'eliasprofissional05@gmail.com';
const ADMIN_PASS = 'Juliete2010.';

let people = JSON.parse(localStorage.getItem('prive_models') || '[]');
let coins = parseInt(localStorage.getItem('prive_coins') || '0');
let isAdmin = localStorage.getItem('prive_is_admin') === '1';
let currentUser = localStorage.getItem('prive_current_user') || null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function updateCoinDisplay() {
  document.getElementById('coin-display').textContent = coins + ' moedas';
}

function saveModels() {
  localStorage.setItem('prive_models', JSON.stringify(people));
}

function saveCoins() {
  localStorage.setItem('prive_coins', coins);
  updateCoinDisplay();
}

function render() {
  updateCoinDisplay();
  const main = document.getElementById('main');
  if (isAdmin) {
    renderAdmin();
    return;
  }
  if (!people.length) {
    main.innerHTML = '<p style="text-align:center;color:#aaa;margin-top:40px">Nenhuma modelo disponível no momento.</p>';
    return;
  }
  // Shuffle for random order
  const shuffled = [...people].sort(() => Math.random() - 0.5);
  main.innerHTML = `
    <h2 style="margin-bottom:12px">Modelos Online</h2>
    <div class="grid">
      ${shuffled.map(p => `
        <div class="card" onclick="startCall('${p.id}')">
          <img src="${p.photo || ''}" alt="">
          <div class="card-info">
            <b><span class="online"></span>${p.name}, ${p.age}</b>
            <small>${p.city}</small>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="btn" style="margin-top:20px" onclick="randomCall()">Iniciar chamada aleatória</button>
  `;
}

function renderAdmin() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2>Painel Admin</h2>
      <button class="btn ghost" style="width:auto;padding:8px 14px" onclick="logout()">Sair</button>
    </div>
    <button class="btn" onclick="openNewModel()">+ Nova Modelo</button>
    <div class="admin-list">
      ${people.map(p => `
        <div class="admin-item">
          <div>
            <b>${p.name}, ${p.age}</b><br>
            <small>${p.city}</small>
          </div>
          <button onclick="deleteModel('${p.id}')" style="color:#ff6b6b">Excluir</button>
        </div>
      `).join('') || '<p style="color:#aaa">Nenhuma modelo cadastrada.</p>'}
    </div>
    <hr style="border-color:#ffffff15;margin:20px 0">
    <h3>Preços de Moedas</h3>
    <p style="color:#aaa;font-size:14px">Gestão de preços em breve (protótipo local).</p>
  `;
}

function openNewModel() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-box">
      <h3>Nova Modelo</h3>
      <label>Nome</label>
      <input class="field" id="m-name" placeholder="Nome">
      <label>Idade</label>
      <input class="field" id="m-age" type="number" placeholder="Idade">
      <label>Cidade</label>
      <input class="field" id="m-city" placeholder="Cidade">
      <label>URL da Foto</label>
      <input class="field" id="m-photo" placeholder="https://...">
      <label>URL do Vídeo</label>
      <input class="field" id="m-video" placeholder="https://...">
      <button class="btn" onclick="saveNewModel()">Salvar</button>
      <button class="btn ghost" onclick="this.closest('.modal').remove()">Cancelar</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function saveNewModel() {
  const name = document.getElementById('m-name').value.trim();
  const age = document.getElementById('m-age').value;
  const city = document.getElementById('m-city').value.trim();
  const photo = document.getElementById('m-photo').value.trim();
  const video = document.getElementById('m-video').value.trim();
  if (!name || !age) return showToast('Preencha nome e idade');
  people.push({
    id: Date.now().toString(),
    name, age, city, photo, video,
    status: 'online'
  });
  saveModels();
  document.querySelector('.modal').remove();
  showToast('Modelo adicionada');
  render();
}

function deleteModel(id) {
  people = people.filter(p => p.id !== id);
  saveModels();
  render();
}

function startCall(id) {
  const p = people.find(x => x.id === id);
  if (!p) return;
  if (!p.video) return showToast('Esta modelo ainda não tem vídeo cadastrado');
  showCall(p);
}

function randomCall() {
  const withVideo = people.filter(p => p.video);
  if (!withVideo.length) return showToast('Nenhuma modelo com vídeo cadastrado');
  const p = withVideo[Math.floor(Math.random() * withVideo.length)];
  showCall(p);
}

function showCall(p) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-box" style="max-width:480px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b>${p.name}, ${p.age} — ${p.city}</b>
        <button onclick="this.closest('.modal').remove()">✕</button>
      </div>
      <video src="${p.video}" controls autoplay style="width:100%;border-radius:12px;background:#000"></video>
      <p style="font-size:13px;color:#aaa;margin-top:8px">Vídeo demonstrativo da chamada.</p>
    </div>
  `;
  document.body.appendChild(modal);
}

function openAuth() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-box">
      <h3>Entrar</h3>
      <label>E-mail</label>
      <input class="field" id="auth-email" type="email" placeholder="E-mail">
      <label>Senha</label>
      <input class="field" id="auth-pass" type="password" placeholder="Senha">
      <button class="btn" onclick="doLogin()">Entrar</button>
      <button class="btn ghost" onclick="this.closest('.modal').remove()">Fechar</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function doLogin() {
  const email = document.getElementById('auth-email').value.trim().toLowerCase();
  const pass = document.getElementById('auth-pass').value;
  if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
    isAdmin = true;
    localStorage.setItem('prive_is_admin', '1');
    document.querySelector('.modal').remove();
    showToast('Login admin realizado');
    render();
    return;
  }
  showToast('Credenciais inválidas');
}

function logout() {
  isAdmin = false;
  localStorage.removeItem('prive_is_admin');
  render();
}

// Init
render();
</script>
</body>
</html>
